steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract Tahap 4.zip
    run: unzip "Tahap 4.zip" -d extracted_project

  - name: Check extracted folder structure
    run: ls -la extracted_project

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Build with Gradle
    # Ganti 'ANDROID' sesuai dengan nama folder yang muncul dari langkah 'ls -la' di atas
    working-directory: ./extracted_project/ANDROID 
    run: |
      chmod +x gradlew
      ./gradlew --no-daemon assembleDebug
