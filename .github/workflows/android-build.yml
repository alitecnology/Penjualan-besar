
name: Build KelasLive Admin APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Admin ZIP
        run: |
          ZIP_FILE="Admin Control.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP KelasLive Admin tidak ditemukan!"
            exit 1
          fi

          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source

          ANDROID_DIR="$(dirname "$(find build-source -type f -path '*/android/build.gradle.kts' -print -quit)")"

          if [ -z "$ANDROID_DIR" ]; then
            echo "Folder Android tidak ditemukan!"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$ANDROID_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KelasLive-Admin-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          
