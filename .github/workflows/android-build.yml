
- name: Extract Tahap 4.zip
  run: |
    clear
    mkdir -p project
    unzip -o "Tahap 4.zip" -d project

- name: Build APK Android
  shell: bash
  run: |
    clear

    GRADLE_WRAPPER=$(find project -type f -name "gradlew" | head -n 1)

    if [ -z "$GRADLE_WRAPPER" ]; then
      echo "ERROR: gradlew tidak ditemukan dalam Tahap 4.zip"
      find project -maxdepth 5 -type f
      exit 1
    fi

    GRADLE_DIR=$(dirname "$GRADLE_WRAPPER")
    echo "Folder proyek: $GRADLE_DIR"

    cd "$GRADLE_DIR"
    chmod +x gradlew
    ./gradlew --no-daemon assembleDebug
