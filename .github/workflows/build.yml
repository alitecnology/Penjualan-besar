name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          ls -la
          unzip -o "AI Asisten Control.zip"
          echo "=== ISI FOLDER ==="
          ls -R | head -n 100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cari folder Android
        id: cari
        run: |
          S=$(find . -name "settings.gradle" | head -n 1)
          [ -n "$S" ] || { echo "settings.gradle tidak ditemukan"; exit 1; }
          echo "Ditemukan di: $S"
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.cari.outputs.dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Asisten-Control-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
