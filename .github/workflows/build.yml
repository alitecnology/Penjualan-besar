- name: Cari folder project
  id: cari
  run: |
    # Unzip file yang namanya ada spasi, harus pakai tanda petik
    if [ -f "AI Asisten Control.zip" ]; then
      unzip -o "AI Asisten Control.zip"
    fi
    
    echo "=== ISI FOLDER ==="
    ls -R | head -n 100

    # Cari settings.gradle dimanapun
    S=$(find . -name "settings.gradle" | head -n 1)
    [ -n "$S" ] || { echo "settings.gradle tidak ditemukan"; exit 1; }
    echo "Ditemukan di: $S"
    echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"
